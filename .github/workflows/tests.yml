name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # The floor is worth one run: composer.json claims 8.2, and the lowest
          # resolvable set is the only thing that proves the claim.
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # No extensions beyond core streams - that is a promise this package
          # makes in its README, so CI must not quietly install more.
          extensions: none, json, mbstring, tokenizer, pcre, spl, phar
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run the suite
        run: vendor/bin/phpunit

  conformance:
    name: conformance against a real rostam-server
    runs-on: ubuntu-latest

    # The suite's default target is a fake server written in PHP - fast, and able
    # to misbehave on demand. But a fake is a reimplementation of the protocol by
    # the same hand that wrote the client, so a shared misreading of the wire
    # would pass every test here and still fail in production. This lane rules
    # that class out by talking to the real binary.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Fetch the latest rostam-server
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/rostamlabs/rostam/releases/latest \
            | grep -o 'https://[^"]*linux_amd64\.tar\.gz' | head -n1)
          echo "downloading $url"
          curl -fsSL "$url" -o rostam.tar.gz
          tar xzf rostam.tar.gz
          ./rostam-server --version

      - name: Start it on the binary TCP listener
        run: |
          set -euo pipefail
          # -insecure: this server is reachable only from this job's own network
          # namespace, and a token would only test the token path, which the fake
          # already covers with one it can choose per test.
          ./rostam-server -tcp 127.0.0.1:7411 -insecure &
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/7411) 2>/dev/null; then
              echo "listening"; exit 0
            fi
            sleep 0.2
          done
          echo "the server never came up"; exit 1

      - name: Run the suite against it
        env:
          ROSTAM_TEST_SERVER: 127.0.0.1:7411
        run: vendor/bin/phpunit
