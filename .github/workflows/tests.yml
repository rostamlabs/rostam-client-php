name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole file again, on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: formatting
    runs-on: ubuntu-latest

    # Once, not per matrix entry. Formatting is one convention for the
    # repository, and Pint's own rules move between releases - asking the OLDEST
    # allowed Pint to agree with the newest about the same file is a question
    # with no answer, not a finding.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - run: vendor/bin/pint --test

  test:
    name: PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # The floor is worth one run: composer.json claims 8.2, and the lowest
          # resolvable set is the only thing that proves the claim.
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run the suite
        run: vendor/bin/phpunit

  conformance:
    name: conformance against rostam-server (${{ matrix.channel }})
    runs-on: ubuntu-latest

    # The suite's default target is a fake server written in PHP - fast, and able
    # to misbehave on demand. But a fake is a reimplementation of the protocol by
    # the same hand that wrote the client, so a shared misreading of the wire
    # would pass every test here and still fail in production. This lane rules
    # that class out by talking to the real binary.
    #
    # Twice. GitHub's releases/latest skips pre-releases, so it answers the stable
    # server people run today - and a lane that only ever saw that one would
    # never meet an op that arrived in a beta. The pre-release lane takes the
    # highest version of any kind, pre-releases included - by version, not by
    # date, so a patch to an old line published last cannot displace a newer
    # beta. Tests for an op newer than the server they meet skip, by the version
    # this job exports.
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, prerelease]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Fetch rostam-server (${{ matrix.channel }})
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/rostamlabs/rostam/releases?per_page=50" -o releases.json

          # The HIGHEST version, not the newest by date. Picking by date, a patch
          # published after a beta would hand the pre-release lane a stable
          # server, and every beta-only test would skip without failing. Stable
          # takes the highest release that is not a pre-release. The picker also
          # names the asset and the checksums.txt of the SAME release.
          set -- $(php -r '
            $best = null;
            foreach (json_decode(file_get_contents("releases.json"), true) as $release) {
                if ($release["draft"] || (getenv("CHANNEL") === "stable" && $release["prerelease"])) {
                    continue;
                }
                $assets = array_column($release["assets"], "browser_download_url", "name");
                foreach ($assets as $asset => $download) {
                    if (str_ends_with($asset, "linux_amd64.tar.gz")
                        && ($best === null || version_compare(ltrim($release["tag_name"], "v"), ltrim($best[0], "v"), ">"))) {
                        $best = [$release["tag_name"], $download, $asset, $assets["checksums.txt"] ?? ""];
                    }
                }
            }
            if ($best === null) { fwrite(STDERR, "no linux_amd64 release to test against\n"); exit(1); }
            if ($best[3] === "") { fwrite(STDERR, "release {$best[0]} ships no checksums.txt\n"); exit(1); }
            echo $best[1], " ", $best[2], " ", $best[3];
          ')
          url=$1 name=$2 sums=$3

          echo "downloading $name"
          curl -fsSL "$url" -o rostam.tar.gz
          curl -fsSL "$sums" -o checksums.txt

          # The one input this job does not get from a pinned source is the
          # binary it then executes, so it is checked against the checksums the
          # release publishes beside it.
          expected=$(awk -v name="$name" '$2 == name || $2 == "*"name {print $1}' checksums.txt)
          actual=$(sha256sum rostam.tar.gz | cut -d' ' -f1)
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::checksum mismatch for $name (expected '$expected', got '$actual')"
            exit 1
          fi

          tar xzf rostam.tar.gz

          # "rostam-server 0.7.0-beta6 (go1.26.5 linux/amd64)" -> 0.7.0-beta6.
          # A version that does not read as one fails the job: tests gate on it,
          # and a garbled one would make every newer-op test skip in silence.
          version=$(./rostam-server --version | awk '{print $2}')
          if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::could not read a version from: $(./rostam-server --version)"
            exit 1
          fi
          echo "rostam-server $version"
          echo "ROSTAM_TEST_SERVER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Start it on the binary TCP listener
        run: |
          set -euo pipefail
          # -insecure: this server is reachable only from this job's own network
          # namespace, and a token would only test the token path, which the fake
          # already covers with one it can choose per test.
          ./rostam-server -tcp 127.0.0.1:7411 -insecure &
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/7411) 2>/dev/null; then
              echo "listening"; exit 0
            fi
            sleep 0.2
          done
          echo "the server never came up"; exit 1

      - name: Run the suite against it
        env:
          ROSTAM_TEST_SERVER: 127.0.0.1:7411
          # This job started that server two steps ago and nothing else uses
          # it, so the destructive tests (flush wipes the keyspace) may run.
          ROSTAM_TEST_SERVER_IS_DISPOSABLE: '1'
        run: vendor/bin/phpunit
